# mise configuration - development tools and CLI utilities
# This replaces the binary downloads from chezmoi external

[tools]
# === Programming Languages & Runtimes ===
go = "1.27.3"
node = "26.13.0"
python = "3.15.2"
rust = "stable"                   # Required for Cargo-based tools
uv = "0.13.7"

# === Development Tools ===
"aqua:anomalyco/opencode" = "2.2.5"
"aqua:anthropics/claude-code" = "2.1.318"
"aqua:openai/codex" = "0.167.0"
direnv = "2.38.2"                # Environment variable management
github-cli = { version = "2.103.3", postinstall = "gh extension install github/gh-stack --force" }
"aqua:hadolint/hadolint" = "2.15.1" # Dockerfile linter
helm = "4.3.1"
kubectl = "1.37.2"
"aqua:argoproj/argo-cd" = "3.6.1"
"aqua:aws/aws-cli" = "2.39.5"
"pipx:linode-cli" = "5.70.0"
"aqua:go-task/task" = "3.54.0"
terraform = "1.17.1"

# === CLI Utilities ===
"aqua:FiloSottile/age" = "1.3.2"                 # File encryption
"aqua:sharkdp/bat" = "0.26.1"                    # Better cat
"cargo:eza" = "0.23.5"                            # Better ls
"aqua:sharkdp/fd" = "10.5.1"                     # Better find
"aqua:junegunn/fzf" = "0.74.5"                  # Fuzzy finder (junegunn originally, now mirrors exist)
"aqua:jqlang/jq" = "1.8.2"                       # JSON processor
"aqua:dundee/gdu" = "5.38.0"                     # Disk usage analyzer
"aqua:sharkdp/hexyl" = "0.17.0"                  # Hex viewer
"aqua:sharkdp/hyperfine" = "2.0.0"              # Benchmarking tool
"aqua:sharkdp/numbat" = "1.24.0"                 # Calculator
"aqua:BurntSushi/ripgrep" = "15.2.0"             # Better grep
"aqua:starship/starship" = "1.27.0"              # Shell prompt
"aqua:tealdeer-rs/tealdeer" = "1.9.1"            # Fast tldr client
"aqua:aquasecurity/trivy" = "0.76.2"             # Security scanner
"aqua:ajeetdsouza/zoxide" = "0.10.0"              # Better cd
"aqua:twpayne/chezmoi" = "2.74.0"
"cargo:tokei" = "14" # count lines of code
"pipx:httpie" = "3.2.4"  # Better curl
yq = "4.54.2"                    # YAML processor


# === Build & CI Tools ===
"pipx:black" = "26.10.1"          # Python formatter
"pipx:pre-commit" = "4.7.0"      # Git hook framework
"pipx:yamllint" = "1.38.0"       # YAML linter

# === NPM Global Tools ===


[settings]
paranoid = false

# Use specific plugin repositories if needed
[plugins]
# Custom plugins can be specified here
